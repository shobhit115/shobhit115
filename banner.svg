<svg xmlns="http://www.w3.org/2000/svg" width="854" height="180" viewBox="0 0 854 180">
  <style>
    .text { 
      font-size: 48px; 
      font-weight: 700; 
      font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; 
    } 
    .desc { 
      font-size: 18px; 
      font-weight: 500; 
      font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; 
    } 
    .text, .desc { 
      animation: fadeIn 1.2s ease-in-out forwards; 
    } 
    @keyframes fadeIn { 
      from { opacity: 0; } 
      to { opacity: 1; }  
    } 
  </style>

  <defs>
    <linearGradient id="linear" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="30%" stop-color="#047857"/>
      <stop offset="65%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
  </defs>

  <g transform="translate(427, 90) scale(1, 1) translate(-427, -90)">
    <path fill="url(#linear)" opacity="0.4">
      <animate attributeName="d" dur="20s" repeatCount="indefinite"
        values="
        M0 0L 0 120Q 213.5 150 427 130T 854 145L 854 0 Z;
        M0 0L 0 135Q 213.5 140 427 150T 854 130L 854 0 Z;
        M0 0L 0 150Q 213.5 120 427 140T 854 125L 854 0 Z;
        M0 0L 0 120Q 213.5 150 427 130T 854 145L 854 0 Z">
      </animate>
    </path>

    <path fill="url(#linear)" opacity="0.4">
      <animate attributeName="d" dur="20s" repeatCount="indefinite" begin="-10s"
        values="
        M0 0L 0 130Q 213.5 160 427 140T 854 150L 854 0 Z;
        M0 0L 0 140Q 213.5 120 427 130T 854 135L 854 0 Z;
        M0 0L 0 135Q 213.5 125 427 150T 854 155L 854 0 Z;
        M0 0L 0 130Q 213.5 160 427 140T 854 150L 854 0 Z">
      </animate>
    </path>
  </g>

  <text x="50%" y="35%" text-anchor="middle" class="text" fill="#ffffff">
    I am Shobhit Singh
  </text>

  <text x="50%" y="65%" text-anchor="middle" class="desc" fill="#ffffff">
    Software Engineer
  </text>
</svg>
