<svg xmlns="http://www.w3.org/2000/svg" width="854" height="170" viewBox="0 0 854 170">
  <style>
    .text { 
      font-size: 46px; 
      font-weight: 700; 
      font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; 
    } 
    .desc { 
      font-size: 18px; 
      font-weight: 500; 
      font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; 
    } 
    .text, .desc { 
      animation: fadeIn 1.2s ease-in-out forwards; 
    } 
    @keyframes fadeIn { 
      from { opacity: 0; } 
      to { opacity: 1; }  
    } 
  </style>

  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#004d1f"/>
      <stop offset="40%" stop-color="#008f38"/>
      <stop offset="70%" stop-color="#00c749"/>
      <stop offset="100%" stop-color="#5dff9c"/>
    </linearGradient>
  </defs>

  <g transform="translate(427,85) translate(-427,-85)">
    <path fill="url(#g)" opacity="0.35">
      <animate attributeName="d" dur="18s" repeatCount="indefinite"
        values="
        M0 0L0 110Q213 140 427 120T854 135L854 0Z;
        M0 0L0 125Q213 130 427 140T854 120L854 0Z;
        M0 0L0 135Q213 110 427 125T854 115L854 0Z;
        M0 0L0 110Q213 140 427 120T854 135L854 0Z">
      </animate>
    </path>

    <path fill="url(#g)" opacity="0.35">
      <animate attributeName="d" dur="18s" repeatCount="indefinite" begin="-9s"
        values="
        M0 0L0 120Q213 150 427 130T854 140L854 0Z;
        M0 0L0 130Q213 115 427 120T854 125L854 0Z;
        M0 0L0 125Q213 120 427 140T854 145L854 0Z;
        M0 0L0 120Q213 150 427 130T854 140L854 0Z">
      </animate>
    </path>
  </g>

  <text x="50%" y="38%" text-anchor="middle" class="text" fill="#ffffff">
